# tasks file for apache
---
- name: Install Apache
  ansible.builtin.apt:
    name: "{{ apache_package }}"
    state: present
    update_cache: yes

- name: Enable and start Apache
  ansible.builtin.service:
    name: "{{ apache_service }}"
    enabled: yes
    state: started

- name: Copy Apache virtual host configuration
  ansible.builtin.template:
    src: apache.conf.j2
    dest: "{{ apache_conf_dir }}/000-default.conf"
    owner: root
    group: root
    mode: '0644'
  notify: restart apache

- name: Copy index.html
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    owner: www-data
    group: www-data
    mode: '0644'

- name: Ensure Apache is running and enabled
  ansible.builtin.service:
    name: "{{ apache_service }}"
    state: started
    enabled: yes
