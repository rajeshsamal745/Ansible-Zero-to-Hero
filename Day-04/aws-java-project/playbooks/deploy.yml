---
- name: Rolling Application Deployment
  hosts: app_servers
  become: true

  serial: 1

  roles:
    - application

  post_tasks:
    - name: Wait for application health
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}/health"
        status_code: 200
      register: health_check
      retries: 10
      delay: 5
      until: health_check.status == 200
