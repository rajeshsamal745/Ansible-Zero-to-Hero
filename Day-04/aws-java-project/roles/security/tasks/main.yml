---
# tasks file for roles/security
- name: Harden SSH PermitRootLogin setting
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: "PermitRootLogin {{ ssh_permit_root_login }}"
  notify: Restart SSH

- name: Harden SSH PasswordAuthentication setting
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: "PasswordAuthentication {{ ssh_password_authentication }}"
  notify: Restart SSH

- name: Ensure Port is configured correctly
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?Port'
    line: "Port {{ ssh_port }}"
  notify: Restart SSH

- name: Validate SSH configuration health
  ansible.builtin.command:
    cmd: sshd -t
  changed_when: false

