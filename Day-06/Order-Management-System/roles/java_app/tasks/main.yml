---
# tasks file for java_app
- name: Install Java
  become: true
  ansible.builtin.apt:
    name: "openjdk-{{ java_version }}-jdk"
    state: present
    update_cache: true

- name: Create application user
  become: true
  ansible.builtin.user:
    name: orderapp
    system: true
    shell: /usr/sbin/nologin

- name: Create application directory
  become: true
  ansible.builtin.file:
    path: /opt/order-management
    state: directory
    owner: orderapp
    group: orderapp
    mode: "0755"
